<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">

  <meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta property="og:image" content="{{ '/assets/img/miss-quote.png' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="{{ '/assets/img/miss-quote.png' | relative_url }}">

  <!-- Stamped with the build time: neither file carries a Cache-Control header,
       so without this a browser is free to keep serving the last one it saw. -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <!-- Set the theme before first paint so a light-mode reader never sees a dark flash. -->
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('mq-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
    })();
  </script>
</head>
<body class="{% if page.url == '/' %}is-home{% else %}is-doc{% endif %}">

  {% include nav.html %}

  {{ content }}

  {% include footer.html %}

  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
