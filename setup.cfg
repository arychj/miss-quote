[metadata]
name = miss-quote
# Not the version anything is deployed as. The image is versioned by the git tag
# the release workflow cuts, so a number here would be a second source of truth
# with nothing keeping it honest.
version = 0.0.0
description = A Discord bot that transcribes a voice channel and lets tools answer it
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.12
package_dir =
    = src
packages = find:

# Dependencies are in requirements.txt rather than install_requires: one of them
# is pinned to a VCS revision, which is a direct reference and belongs somewhere
# a container build reads it verbatim. The image installs from there.

[options.packages.find]
where = src

# Carried into an installed copy alongside the code that resolves them relative
# to itself: the VAD graph and the quote list the image ships with.
[options.package_data]
miss_quote =
    resources/*.csv
    stt/models/*.onnx

[options.entry_points]
console_scripts =
    miss-quote = miss_quote.__main__:main
