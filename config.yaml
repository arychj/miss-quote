# Everything about how the bot behaves, and which servers it behaves that way in.
#
# Mounted into the pod at /config/config.yaml from a ConfigMap; override the
# location with CONFIG_FILE. Read once at startup, so editing it means
# restarting the pod. The values below are placeholders.
#
# What the environment still carries is what a deployment *points at* — hosts,
# ports, directories, and the token — because those are what a manifest already
# has and what a secret has to stay in. See .env.example.

# Settings that apply to the whole deployment rather than to one server.
#
# Every one of them has a default, so this block is optional in its entirety and
# so is any line in it; what is below is what you get by saying nothing. A name
# nothing reads — a typo, or a setting written under the wrong section — is
# reported at startup rather than ignored, and so is a value that will not
# parse, which falls back to its default rather than stopping the pod.
settings:
  # Speech synthesis. Where the synthesizer *is* is TTS_HOST and TTS_PORT, and
  # which voice it uses is TTS_VOICE.
  #
  # Not to be confused with the `tts` tool a server enables further down. This
  # is one synthesizer for the whole deployment; that is whether a given server
  # is allowed to speak through it.
  tts:
    # How long to wait on the synthesizer for the next piece of a clip. A budget
    # for a single wait rather than for the whole clip, so a long phrase
    # arriving steadily is not cut off for taking a long time.
    #
    # timeout_seconds: 30

    # How long the player waits mid-clip before giving up on the rest of it.
    #
    # stall_seconds: 10

    # How much speech to have in hand before a clip starts, in milliseconds.
    # Covers a synthesizer that renders a phrase whole before sending any of it,
    # which otherwise leaves a gap between a chime and the words behind it. 0
    # starts on the first chunk.
    #
    # lead_ms: 500

    # How music played under a wait arrives and leaves, in milliseconds. Only
    # the summary tool asks for any, and only for a channel that named a clip;
    # see `hold_music` further down.
    #
    # Up quickly, because the gap the music is covering has already started by
    # the time it begins. Down slowly, because what replaces it is a sentence,
    # and the fade is timed to end where the first word starts. 0 for either is
    # no fade at that end, which is a cut.
    #
    # hold_fade_in_ms: 500
    # hold_fade_out_ms: 2000

    # Days a rendered clip survives in SPEECH_DIR/cache without being played,
    # counted from the last time it was. 0, or any value below 1, keeps them
    # forever. Chimes live in SPEECH_DIR/chimes and are never reaped, whatever
    # this says.
    #
    # cache_retention_days: 90

  # The running tally the `scoreboard` tool keeps. Where it is written down is
  # CREDITS_FILE.
  credits:
    # What a balance is denominated in, in the singular; the plural is grown
    # from it, so "penny" is announced as "2 pennies". Only the wording changes.
    #
    # currency: credit

    # How often a changed tally is written to disk. Cheap, so it is quick: a pod
    # killed outright loses this many seconds of fines. 0, or below, keeps the
    # tally in memory and writes it only on shutdown.
    #
    # save_seconds: 5

    # How often a changed tally is published to the voice channel topic.
    # Discord's bucket for it is roughly six a second, so this is set by how
    # often a tally is worth reading rather than by a rate limit. 0, or below,
    # keeps the tally off the channel, and still counts and saves it.
    #
    # topic_seconds: 10

  # How a fine from `verbal-morality` is announced. What one is worth is the
  # scoreboard's business, above.
  fines:
    # How soon after being fined a speaker is told they are "also fined" rather
    # than hearing the whole sentence again. 0 turns the second wording off.
    #
    # repeat_seconds: 5

    # How long a violation counts against how loudly the next one is announced,
    # and how much each one inside that window takes off. A sliding window, so
    # somebody is back to full volume this long after their last violation. 0%
    # takes nothing off, which turns the backoff off entirely.
    #
    # backoff_seconds: 300
    # backoff_percent: 5

    # The quietest a fine is announced, as a fraction of PLAYBACK_VOLUME, once
    # somebody has sworn enough inside the window to earn the full backoff. At
    # the defaults that is fifteen violations. 0 silences a repeat offender
    # entirely; 1 turns the backoff off, there being nowhere to back off to.
    #
    # volume_floor: 0.25

  # The `quotes` tool, for every server that enables it. The triggers and the
  # lines themselves are a CSV at QUOTES_FILE.
  quotes:
    # How long a trigger stays spent after it fires, so a channel that keeps
    # saying the same word hears the line once. 0, or below, answers every
    # trigger every time.
    #
    # backoff_seconds: 300

  # Where transcripts are written is TRANSCRIPT_DIR, and what clock they are
  # stamped with is TZ.
  transcripts:
    # Days of transcripts to keep. -1, or any value below 1, keeps them forever.
    #
    # retention_days: -1

    # How long a transcript is held open for a reconnect to the same channel. A
    # channel that empties and refills inside the window is one conversation
    # with a gap in it rather than two. 0 seals it on disconnect.
    #
    # resume_seconds: 5

    # What a room listed under a `summary` tool's `monitored_channels` falls
    # back to when it names no windows of its own. Which rooms are written down
    # at all, and when, is per channel and lives down there; this is only the
    # default, for a deployment where every room keeps the same hours.
    #
    # Saying nothing here leaves a listed room with no windows keeping every
    # session. Saying something unreadable leaves it keeping nothing, which is
    # reported at startup.
    #
    # schedule:
    #   - Wed 17:00-00:00

  # What the bot says about itself while a conversation is being kept.
  #
  # A transparency signal rather than a status readout. Everybody can see the
  # bot sitting in a channel, and hearing on its own retains nothing material —
  # a fine is counted and the words behind it are gone. What is worth announcing
  # is the part that leaves something afterwards: a transcript on disk, and the
  # summaries and retellings written off it. So there is a wording for being on
  # the record and none for listening.
  #
  # It follows sessions rather than speech: a session being written down shows
  # this whether or not anybody is talking.
  #
  # There is one presence per bot rather than one per server — Discord has no
  # per-guild presence for a bot — so a deployment recording in one server says
  # so in all of them. Which is why this is here rather than under a server.
  presence:
    # Shown under the bot's name while any session is on the record, and cleared
    # when none is. Empty turns the signal off.
    #
    # The emoji goes in the words. A custom status has an emoji field of its
    # own, and Discord does not apply it for a bot, so one written there would
    # never reach anybody.
    #
    # transcribing: "🎙️ transcribing..."

  # Only used by `summary`. Where the endpoint is, what key it wants, and which
  # model to ask for are LLM_API_BASE, LLM_API_KEY, and LLM_MODEL — one endpoint
  # for the whole deployment, whatever is serving it.
  llm:
    # Budget for one completion, end to end. Generous next to the ASR's: a
    # summary is several hundred tokens of output rather than a sentence.
    #
    # Keep it well under the deployment's termination grace period. A session
    # that seals as the pod goes down is summarized inside the shutdown, and
    # what does not finish there is lost — the transcript survives either way.
    #
    # timeout_seconds: 120

    # A ceiling on what is generated. Not the context window and not the whole
    # request: the input is not counted against it.
    #
    # On a model that reasons before it answers, the reasoning is generated too
    # and comes out of this. Run out mid-thought and the answer is never begun,
    # which arrives as a 200 carrying nothing.
    #
    # max_output_tokens: 1024

    # Whether a model that reasons before answering is allowed to. Sent only to
    # turn reasoning off, so an endpoint that has never heard of the field is
    # never shown it.
    #
    # Reasoning is most of the wall clock. That costs nothing on a summary
    # written after everyone has left, and is dead air on a retelling somebody
    # just asked for out loud.
    #
    # thinking: true

    # How much licence the model has. Higher than a mechanical transform would
    # want, because the output is prose somebody reads for pleasure.
    #
    # temperature: 0.7

  # Where summaries are written is SUMMARY_DIR. The tree inside it is the
  # transcripts' tree — a directory per server and per channel — and each file
  # is named for the transcript it summarizes.
  summaries:
    # Days of summaries to keep. -1, or any value below 1, keeps them forever.
    # Longer than the transcripts is a sensible thing to want: a summary is a
    # fraction of the size and most of the value.
    #
    # retention_days: -1

# Servers the bot may join, by ID. Everything about a server lives under its ID.
#
# The ID appears here and nowhere else: transcript directories are named for the
# alias, so renaming a server on Discord changes nothing. A server that is not
# listed is never joined, by autojoin or by an explicit !join, and an empty
# mapping means the bot joins nothing: recording a server it should not have is
# not something you can take back.
#
# A server whose block is malformed — no alias, or not a mapping at all — is
# dropped and reported at startup rather than crashing the pod.
servers:
  123456789012345678:
    # Names the server's transcript directory. Required.
    alias: first-server

    # Names to record instead of the one Discord reports, by user ID.
    #
    # Discord nicknames are freely editable and frequently not a name at all,
    # which makes them poor labels for a transcript a summarizer will later
    # read. The roster is per server because the same person can be known
    # differently in two places.
    #
    # It is also the only thing a tool knows about who might speak before
    # anybody does, and so who it can render speech for in advance. Somebody
    # left off is still transcribed and still fined, under whatever Discord
    # reports; they just wait for the synthesizer the first time.
    users:
      234567890123456789: Speaker One
      345678901234567890: Speaker Two

    # Tools this server is elected into, by tool name.
    #
    # Each tool decides for itself when it runs — on every utterance, once the
    # bot leaves the channel, or both. All this says is whether the server is
    # opted in, and what settings the tool is handed. A tool listed without
    # `enabled: true` is off, and a name no tool answers to is reported at
    # startup and skipped.
    tools:
      # Answers out loud with a film line when someone says the phrase that sets
      # it off, and then asks the channel where the line came from.
      #
      # The triggers and the lines are one list per deployment, read from
      # QUOTES_FILE, because a film everybody in one channel has seen is one
      # everybody in the next has too. A trigger that has just fired goes quiet
      # for a while, so a channel that keeps saying the same word only hears the
      # joke once; how long is settings.quotes.backoff_seconds, which is not per
      # server either.
      #
      # Once the line has been said, naming what it came from — "what is
      # Firefly" — earns a credit through `scoreboard` below, announced out
      # loud. A leading "the" is optional either way, `vs` and `versus` are the
      # same word, and a title is matched however the transcript punctuated it.
      # With no scoreboard enabled the question is asked and nothing is paid,
      # which is said once at startup rather than left to be noticed.
      quotes:
        enabled: false
        config:
          # How long the channel has to name the title, from the moment the line
          # has finished playing rather than from the trigger — until it has
          # been said there is nothing to answer. 0 stops the tool asking at
          # all, for a deployment that wants the lines and not the game.
          #
          # answer_seconds: 5

          # How long after the first correct answer a second one still counts.
          # The first answer takes the round; anyone inside this window is paid
          # as well, because two people arriving at the same title half a second
          # apart both knew it and which of them the transcriber returned first
          # is not a fact about who was faster. 0 pays only whoever was first.
          #
          # tie_seconds: 1

          # Endings the announcement picks from, one at random each time. These
          # are ADDED to the ones the tool ships with rather than replacing
          # them, so saying one extra thing costs one line instead of writing
          # out the whole list again.
          #
          # Nothing here should assume what a row points at. The column is
          # called `movie` because it started that way, but a trigger answers
          # for a series, a game, or a book as often as a film, and an
          # announcement that guesses wrong guesses wrong out loud.
          #
          # remarks:
          #   - having watched it more recently than is respectable.
          #   - reasons that are between you and your search history.

          # Whether whoever set a line off is barred from naming it. They have
          # the trigger and the title in front of them and had to recall
          # neither, so a round they can win is one anybody can farm by reading
          # the quote file out loud. An attempt is refused out loud and costs
          # them, rather than being quietly ignored: a rule nobody is told about
          # is one everybody keeps testing.
          #
          # false lets them answer their own round like anybody else, for a
          # server that would rather not police it.
          #
          # penalize_self_answers: true

          # What an attempt costs them. More than the credit it was an attempt
          # to win, so gaming the round is a losing trade however many times it
          # is tried. Taken once per round however many times they try it, and
          # floored at 0 — a penalty below zero is a reward, and the flag above
          # is how to want that.
          #
          # self_answer_penalty: 5

          # Optional. What is said to whoever names it first.
          #
          # `{user}` is their name from `users` above.
          # `{credits}` is what changed hands, already pluralized — "1 credit",
          # "5 credits". What a credit is called is settings.credits.currency.
          # `{remark}` is one of the endings above, drawn fresh each time. A
          # wording without it says the same thing every round.
          #
          # announcement: "Correct! {user}, you are awarded {credits} for {remark}"

          # Optional, and the same placeholders. Said to anyone paid on a tie —
          # the whole sentence again reads as though the bot had lost track of
          # what it just said. Nothing this tool says is dropped for landing
          # while something else is playing, unlike a fine, so a tie is heard
          # rather than swallowed by the award it came in behind.
          #
          # tie_announcement: "{user}, you are also awarded {credits}, for getting there at the same time."

          # Optional, and the same placeholders again. Said to whoever tried to
          # name their own line, where `{credits}` is what it cost them. Never
          # said at all where `penalize_self_answers` is false.
          #
          # self_answer_announcement: "Nuh uh uh. {user}, you set it off, so you don't get to name it. You are fined {credits} for being a dick."

      # Keeps this server's running tally and publishes it to the voice channel
      # topic as `Eli: -9 Erik: -2`, which needs Set Voice Channel Status on the
      # channel.
      #
      # It hears nothing on its own. Other tools count through it —
      # verbal-morality, which fines people, and quotes, which pays them for
      # naming a film — so a server that enables one of those and not this one
      # gets everything except the tally. Nothing else is configured per
      # server: what it counts in and how often it is written and published are
      # settings.credits above, and where the file lives is CREDITS_FILE.
      #
      # Everyone in `users` above starts on the board at nothing spent, and only
      # they are eligible for it: somebody the server has not written down is
      # still heard and still fined, but a Discord nickname does not go in a
      # topic. The four furthest into the red are what fits.
      scoreboard:
        enabled: false

      # Writes down what happened in a voice channel once the bot leaves it,
      # and reads it back out loud when somebody asks.
      #
      # Everything is per voice channel, under `monitored_channels`, and that
      # mapping is also the switch: a channel that is not in it is not
      # summarized, not posted, and does not answer the question either. The
      # keys are matched the way transcript directories are named, so
      # `General Voice` and `general-voice` are the same channel and the key is
      # always the directory the summaries land in.
      #
      # Where the endpoint is and how long it gets is settings.llm above.
      summary:
        enabled: false
        config:
          # Prompts of your own, added to the shipped `recap`, `minutes`, and
          # `bard` — which are prose in `resources/prompts.yaml` inside the
          # image, if you want to read what they say. One written under a
          # shipped name replaces it. Written here rather than inside a channel
          # because a prompt is a library entry, and restating a paragraph of
          # instructions once per room is how two of them end up saying
          # different things by accident.
          #
          # In one of your own, `{transcript_instructions}` is replaced by the
          # paragraph describing the script format — which a prompt summarizing
          # a session wants and a retelling prompt does not, being given a
          # written summary rather than a transcript — and `{retelling_closing}`
          # by the instruction to end on a line that means the story is over.
          # Any other braces are left alone.
          #
          # prompts:
          #   terse: |
          #     {transcript_instructions}
          #
          #     Summarize the conversation in three sentences.

          # The rooms on the record. This list decides what is written down at
          # all, not only what is summarized: **a voice channel absent from it
          # is never transcribed**, whatever else is enabled. The bot still
          # joins it, still hears it, and still fines people in it; nothing said
          # there reaches disk, so there is nothing to summarize or retell.
          #
          # Transcribing a room, summarizing it, and telling it back are one
          # thing to whoever is sitting in it, so they are configured in one
          # place. The price is that turning this tool off stops a server
          # writing anything down.
          monitored_channels:
            general-voice:
              # The text channel to post the summary in, by name. Leave it out
              # to write summaries to disk and post nothing.
              channel: session-summaries

              # When a session in this room may start being written down, as a
              # day and a 24-hour range. Left out, the room keeps every session,
              # or whatever settings.transcripts.schedule says.
              #
              # A window is when an evening may *start* being recorded, not how
              # long it may run for. Read once, when the bot joins: a session
              # that opens inside one keeps writing until everybody
              # disconnects, however far past the end of it. An evening does
              # not stop being the evening at midnight. The same rule the other
              # way, which is worth knowing before setting one: a session
              # opened a minute early is off the record for its whole length,
              # and leaving and rejoining is what fixes that.
              #
              # An end at or before the start runs into the following day, so
              # `Wed 17:00-00:00` is Wednesday evening until midnight and
              # `Wed 21:00-02:00` runs to two on Thursday. `24:00` may be
              # written for the end of a day, and an end equal to the start is
              # the whole 24 hours. The start is included and the end is not.
              # Days are Mon through Sun, or written out, in any case. The
              # clock is TZ.
              #
              # An entry that cannot be read is dropped and reported at
              # startup, and a schedule nothing could be read out of writes
              # nothing down rather than falling back to something wider: a
              # schedule is written by somebody narrowing what is recorded, and
              # a typo in it must not widen it back out.
              #
              # `!start-transcribing` overrides this for one session, including
              # in a room that named no windows at all.
              #
              # schedule:
              #   - Wed 17:00-00:00

              # Which prompt summarizes a sealed session. `recap` is an account
              # of the evening for the people who were there; `minutes` is
              # topics, decisions, and open questions.
              #
              # prompt: recap

              # Which prompt turns a stored summary into something to say out
              # loud, and roughly how long it should be. `bard` is written for a
              # synthesizer — no markdown, no bullets, no emoji — and tells the
              # session back as a story, in the third person, signing off so the
              # room knows it ended.
              #
              # The length is a target rather than a cap: 200 words is about a
              # minute out loud, and a quiet evening is allowed to be shorter.
              #
              # retelling_prompt: bard
              # retelling_words: 200

              # Below this many utterances a session is not a conversation, and
              # a summary of it would be longer than the transcript.
              #
              # minimum_utterances: 5

              # How soon the channel can be told the same evening again. 0, or
              # below, tells it every time it is asked. Per evening rather than
              # per channel, so asking about a different night is a different
              # question and gets an answer.
              #
              # backoff_seconds: 120

              # How long the room can sit quiet before the rest of the night
              # counts as a different one. A transcript is one connection, and
              # settings.transcripts.resume_seconds is a handful of seconds —
              # enough for a client dropping, not for a pod restart or for a
              # room that empties while everybody refills a glass. Past that the
              # evening is filed in pieces, and this is what puts it back
              # together to be retold as one story.
              #
              # Not the resume window and not to be set to match it: that one
              # holds a session open and delays the summary behind it, while
              # this is read long afterwards off files already on disk.
              #
              # session_gap_minutes: 10

              # What plays while the model is still thinking, and what plays
              # when there is nothing to think about. All three are rendered at
              # startup, so the announcement starts straight away and covers
              # the wait rather than following it.
              #
              # `empty` and `missing` are different answers on purpose: one says
              # nothing has ever been written down in this room, and the other
              # says there is nothing from the night that was named. A channel
              # told the first when the second is true goes looking for a
              # misconfiguration that is not there.
              #
              # preamble: "Sure! Let me go look at my notes."
              # empty: "I don't have any notes from this channel yet."
              # missing: "I don't have any notes from then."

              # A fixed line said once the story is told, for a server that
              # would rather hear the same words every time. Off unless you set
              # one: the retelling prompt already ends the story itself, and a
              # fixed sentence after one that has just said goodbye is one
              # goodbye too many. Set it and it is rendered at startup, like the
              # preamble.
              #
              # closing: "I wonder what'll happen tonight?"

              # Music under the wait, for the part of it the preamble does not
              # cover. Off unless you name a clip, and nothing is shipped: this
              # is a WAV you put in SPEECH_DIR/chimes yourself, named here
              # without its extension, exactly like a tool's `chime`.
              #
              # It loops, so what belongs there is a short passage that meets
              # itself rather than a track — and it is read into memory whole
              # and held for the life of the process, so ten to thirty seconds
              # is the size to author. It fades up when the preamble ends and
              # is gone by the first word of the retelling; the two spans are
              # settings.tts.hold_fade_in_ms and hold_fade_out_ms.
              #
              # `hold_volume` is a fraction of PLAYBACK_VOLUME, so it is however
              # much quieter than the talking the music should be. It is per
              # channel because the clip is: two pieces of music are not the
              # same loudness. Anything outside 0 to 1 is clamped to it.
              #
              # hold_music: on-hold
              # hold_volume: 0.15

              # What the bot answers to, and how asking starts. Both replace
              # their defaults rather than adding to them: they are a matching
              # vocabulary, and renaming the bot should make the old name stop
              # working.
              #
              # Punctuation is ignored on both sides, so several spellings are
              # listed because an ASR guesses at a name it has never been told.
              # The name has to come first and the trigger after it, in the same
              # breath — an unaddressed "what happened last session" is somebody
              # talking to the room.
              #
              # Triggers are the start of a question rather than the whole of
              # one. Which evening is being asked about is a clause on the end,
              # so "what happened" covers "what happened last session", "what
              # happened two weeks ago" and "what happened on the twelfth"
              # without a line each. What is understood after a trigger:
              #
              #   nothing, or "last time" / "last session" / "last night"
              #   "last week", "a week ago", "two weeks ago" … "eight weeks ago"
              #   "on the twelfth", "the twenty fifth", "the 12th"
              #
              # A day names one of the last two months: earlier this month if it
              # has already been, and the month before if it has not. Counting
              # back weeks lands on the nearest evening within a few days of the
              # date, because a channel that meets on a night of the week does
              # not meet on a date.
              #
              # A trigger has to be followed by one of those or by nothing at
              # all, which is what stops "Miss Quote, what happened to my beer"
              # from being a question about last Thursday.
              #
              # name: [miss quote, misquote, missquote, mis quote, ms quote, mizquote]
              # triggers:
              #   - what happened
              #   - what did we do
              #   - recap
              #   - read me your notes
              #   - tell me about

      # Says things out loud. Every other tool that answers a channel goes
      # through this one, so a server without it hears nothing: fines are still
      # counted, rounds are still paid, and neither is spoken. Which is said
      # once at startup rather than left to be noticed.
      #
      # It owns the rendered-speech cache, the chime directory, and the voice
      # connection. How it synthesizes — the host, the voice, the head start,
      # how long a clip is kept — is settings.tts above, because that is one
      # synthesizer for the whole deployment; this only says whether this server
      # is allowed to use it.
      #
      # There is nothing to configure per server, so there is no `config` block.
      tts:
        enabled: false

      # Announces a fine, out loud, when someone says one of `words`.
      #
      # The words below are placeholders. What a server objects to is its own
      # business and belongs in the mounted ConfigMap, not in this repository.
      #
      # The fine is handed to `scoreboard` above, which is what keeps it. With
      # no scoreboard enabled the fine is announced and not counted, which is
      # said once at startup rather than left to be noticed.
      #
      # A repeat offender is announced more quietly, down to
      # settings.fines.volume_floor; none of that is per server, so it is set
      # above rather than here.
      #
      # Every name in `users` above is rendered at startup, against one, two,
      # and three violations and in both wordings below, so the fine lands while
      # the offence is still what the channel is talking about.
      verbal-morality:
        enabled: false
        config:
          # Stems, not whole words: each is expanded at startup into the
          # endings it is said with, so `fiddlestick` also catches
          # `fiddlesticked`, `fiddlesticking`, and `fiddlesticker`. List the
          # root and leave the conjugating to the tool.
          words:
            - fiddlestick
            - poppycock

          # Optional. The tool carries the line from the film, so a server that
          # only wants the default can leave this out entirely.
          #
          # `{user}` is the speaker's name from `users` where one is set.
          # `{credits}` is the fine, already pluralized: one credit per
          # forbidden word in the utterance, so "1 credit" or "3 credits". What
          # a credit is called is settings.credits.currency.
          # `{violations}` is "a violation" or "multiple violations", to match.
          #
          # announcement: "{user}, you are fined {credits} for {violations} of the verbal morality statute."

          # Optional, and the same placeholders. Said instead when the same
          # speaker is fined again inside settings.fines.repeat_seconds —
          # reading the whole sentence out again sounds like a bot that has lost
          # track of what it just said.
          #
          # repeat_announcement: "{user}, you are also fined {credits} for {violations} of the verbal morality statute."

          # Optional. A 16-bit WAV played ahead of the announcement, named
          # relative to SPEECH_DIR/chimes — put the file there by hand. Mono or
          # stereo, any sample rate.
          #
          # The name leaves the extension off: `chime` is `chime.wav`. WAV is
          # the only format there is here, so writing it out said nothing.
          #
          # chime: chime

  876543210987654321:
    alias: second-server
    users:
      234567890123456789: Someone Else
