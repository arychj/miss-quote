# Settings that do not flatten into environment variables.
#
# Mounted into the pod at /config/config.yaml from a ConfigMap; override the
# location with CONFIG_FILE. Read once at startup, so editing it means
# restarting the pod. The values below are placeholders.

# Servers the bot may join, by ID. Everything about a server lives under its ID.
#
# The ID appears here and nowhere else: transcript directories are named for the
# alias, so renaming a server on Discord changes nothing. A server that is not
# listed is never joined, by autojoin or by an explicit !join, and an empty
# mapping means the bot joins nothing: recording a server it should not have is
# not something you can take back.
#
# A server whose block is malformed — no alias, or not a mapping at all — is
# dropped and reported at startup rather than crashing the pod.
servers:
  123456789012345678:
    # Names the server's transcript directory. Required.
    alias: first-server

    # Names to record instead of the one Discord reports, by user ID.
    #
    # Discord nicknames are freely editable and frequently not a name at all,
    # which makes them poor labels for a transcript a summarizer will later
    # read. The roster is per server because the same person can be known
    # differently in two places.
    users:
      234567890123456789: Speaker One
      345678901234567890: Speaker Two

    # Tools this server is elected into, by tool name.
    #
    # Each tool decides for itself when it runs — on every utterance, once the
    # bot leaves the channel, or both. All this says is whether the server is
    # opted in, and what settings the tool is handed. A tool listed without
    # `enabled: true` is off, and a name no tool answers to is reported at
    # startup and skipped.
    tools:
      # Announces a fine, out loud, when someone says one of `words`.
      #
      # The words below are placeholders. What a server objects to is its own
      # business and belongs in the mounted ConfigMap, not in this repository.
      verbal-morality:
        enabled: false
        config:
          words:
            - fiddlesticks
            - poppycock

          # Optional. The tool carries the line from the film, so a server that
          # only wants the default can leave this out entirely. `{user}` is the
          # only placeholder, and is filled with the speaker's name from `users`
          # where one is set.
          #
          # announcement: "{user}, you are fined one credit for a violation of the verbal morality statute."

  876543210987654321:
    alias: second-server
    users:
      234567890123456789: Someone Else
