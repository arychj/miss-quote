[pytest]
testpaths = tests
asyncio_mode = auto

# The package lives under src/ and is not installed for a test run, so the
# directory holding it has to be on sys.path. tests/ has no __init__.py, which
# means pytest puts that directory there instead; invoking pytest as
# `python -m pytest` masks the difference by adding the CWD.
#
# scripts/ is on it as well for the quote-file validator, which CI runs as a
# standalone program and the tests import as a module.
pythonpath = src scripts
