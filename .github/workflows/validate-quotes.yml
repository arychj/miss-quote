name: Validate Quotes

# Separate from Build and Push on purpose. That workflow gates the image and
# takes several minutes; this one reads a text file and is the only thing most
# changes to the quote list need, so it should answer before the reviewer has
# finished reading the diff.
on:
  push:
    branches: [main]
    paths:
      - 'src/miss_quote/resources/quotes.yaml'
      - 'scripts/validate_quotes.py'
      - '.github/workflows/validate-quotes.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/miss_quote/resources/quotes.yaml'
      - 'scripts/validate_quotes.py'
      - '.github/workflows/validate-quotes.yml'
  # A file mounted over the shipped one is the supported way to change the list,
  # and it never touches this repository. This is how its author checks it.
  workflow_dispatch:
    inputs:
      path:
        description: 'Quote file to check, relative to the repository root'
        required: false
        default: 'src/miss_quote/resources/quotes.yaml'

env:
  QUOTES_FILE: ${{ inputs.path || 'src/miss_quote/resources/quotes.yaml' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No container and no image build: the validator needs PyYAML and nothing
      # else, so what has to be reproduced here is one pure wheel. Installing a
      # parser is not the same as installing the tool, which would mean
      # discord.py, onnxruntime and several minutes for a job that reads a text
      # file. An interpreter is asked for by name rather than taken from the
      # runner so that a pip install lands somewhere it is allowed to.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the parser
        run: python -m pip install --disable-pip-version-check pyyaml

      # QUOTES_FILE reaches the Makefile through the environment.
      - name: Check the quote file
        run: make validate-quotes PYTHON=python
